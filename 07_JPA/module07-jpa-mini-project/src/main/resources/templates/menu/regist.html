<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>신규 메뉴 등록 - 원티드 레스토랑</title>
    <style>
        :root {
            --primary-color: #8b4513;
            --input-focus: #d4a373;
            --bg-color: #fcfaf8;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .regist-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box; /* 패딩 포함 너비 계산 */
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #6d360e;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="regist-card">
    <h1><span>😈</span> 신규 메뉴 등록</h1>

    <form action="/menu/regist" method="post">
        <div class="form-group">
            <label>메뉴 이름</label>
            <input type="text" name="menuName" placeholder="메뉴 이름을 입력하세요" required>
        </div>

        <div class="form-group">
            <label>메뉴 가격</label>
            <input type="number" name="menuPrice" placeholder="판매 가격을 입력하세요" required>
        </div>

        <div class="form-group">
            <label>카테고리</label>
            <select name="categoryCode" id="categoryCode">
            </select>
        </div>

        <div class="form-group">
            <label>판매 여부</label>
            <select name="orderableStatus">
                <option value="Y">판매 가능</option>
                <option value="N">판매 중단 (품절)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">등록하기</button>
    </form>

    <a href="/" class="back-link">이전으로 돌아가기</a>
</div>

<script>
    <!-- fetch 는 기본적으로 Get 방식이다. -->
    // category 정보 로드
    fetch('/menu/category')
        .then(res => res.json()) // 문자열 -> 객체
        .then(data => {
            const $categoryCode = document.getElementById("categoryCode");

            for(let index in data) {
                const $option = document.createElement("option");
                $option.value = data[index].categoryCode;
                $option.textContent = data[index].categoryName;
                $categoryCode.appendChild($option);
            }
        })
        .catch(err => console.error("카테고리 로드 실패:", err));
    // fetch("menu/delete/1", {
    //     method : "DELETE",
    //     headers : {
    //         "Content-Type" : "application/json"
    //     },
    //     body : JSON.stringify({
    //         name : "raccoon",
    //         age : 20
    //     })
    // })
</script>
</body>
</html>
