<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 상세 조회</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #ddd;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 8px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            text-align: left;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f9fbff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            background: #e1f5fe;
            color: #01579b;
        }

        .back-button {
            margin-top: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            transition: 0.3s;
        }

        .back-button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍴 메뉴 상세 정보</h1>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>메뉴명</th>
            <th>가격</th>
            <th>카테고리</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${result.menuCode}">1</td>
            <td th:text="${result.menuName}" style="font-weight: bold;">메뉴이름</td>
            <td th:text="${#numbers.formatInteger(result.menuPrice, 0, 'COMMA') + '원'}">0원</td>
            <td th:text="${result.categoryCode}">C1</td>
            <td>
                <span class="status-badge" th:text="${result.orderableStatus}">Y</span>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="text-align: center;">
        <a href="javascript:history.back()" class="back-button">← 목록으로 돌아가기</a>
    </div>
</div>

</body>
</html>
