<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 검색 - 원티드 레스토랑</title>
    <style>
        :root {
            --primary-color: #8b4513;
            --accent-color: #d4a373;
            --bg-linear: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .search-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border-top: 5px solid var(--primary-color);
        }

        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 1rem;
            color: #666;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        input[type="number"] {
            width: 120px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: right;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        .unit {
            font-weight: 600;
            color: #444;
        }

        input[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #6d360e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #999;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="search-card">
    <h1>🔍 JPA Query Method</h1>
    <h3>조건에 맞는 메뉴를 빠르게 찾아보세요.</h3>

    <form action="/menu/search" method="get" class="search-form">
        <div class="input-group">
            <input type="number" name="menuPrice" placeholder="0" required>
            <span class="unit">원 초과</span>
        </div>

        <input type="submit" value="메뉴 목록 조회하기">
    </form>

    <a href="javascript:history.back()" class="back-link">이전 페이지로 돌아가기</a>
</div>

</body>
</html>
